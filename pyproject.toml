[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grism"
version = "0.0.1"
description = "Simple biology-style plots with stats and annotations"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Grant" }
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.10",
  "seaborn>=0.12",
  "pydantic>=2",
  "typer>=0.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.28"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
grism = "grism.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["grism*"]

[tool.setuptools.package-data]
grism = ["data/*.mplstyle", "templates/*.json"]
